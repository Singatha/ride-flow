name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: rideflow
          POSTGRES_USER: rideflow
          POSTGRES_PASSWORD: rideflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rideflow -d rideflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RIDEFLOW_DATABASE_URL: postgresql+asyncpg://rideflow:rideflow@localhost:5432/rideflow
      RIDEFLOW_JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install --editable '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
