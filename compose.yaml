name: rideflow

services:
  db:
    image: postgis/postgis:16-3.4
    # The upstream image is amd64-only; Docker Desktop emulates it on Apple Silicon.
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rideflow}
      POSTGRES_USER: ${POSTGRES_USER:-rideflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rideflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: development
    environment:
      RIDEFLOW_ENVIRONMENT: ${RIDEFLOW_ENVIRONMENT:-local}
      RIDEFLOW_DEBUG: ${RIDEFLOW_DEBUG:-false}
      RIDEFLOW_DATABASE_URL: ${RIDEFLOW_DATABASE_URL:-postgresql+asyncpg://rideflow:rideflow@db:5432/rideflow}
      RIDEFLOW_REDIS_URL: ${RIDEFLOW_REDIS_URL:-redis://redis:6379/0}
      RIDEFLOW_CORS_ORIGINS: '${RIDEFLOW_CORS_ORIGINS:-["http://localhost:5173"]}'
      RIDEFLOW_JWT_SECRET: ${RIDEFLOW_JWT_SECRET:-local-development-secret-change-before-production}
      RIDEFLOW_ACCESS_TOKEN_TTL_MINUTES: ${RIDEFLOW_ACCESS_TOKEN_TTL_MINUTES:-15}
      RIDEFLOW_REFRESH_TOKEN_TTL_DAYS: ${RIDEFLOW_REFRESH_TOKEN_TTL_DAYS:-30}
      RIDEFLOW_RIDE_OFFER_TTL_SECONDS: ${RIDEFLOW_RIDE_OFFER_TTL_SECONDS:-20}
      RIDEFLOW_MATCHING_STATE_TTL_SECONDS: ${RIDEFLOW_MATCHING_STATE_TTL_SECONDS:-600}
      RIDEFLOW_MATCHING_LOCK_TTL_SECONDS: ${RIDEFLOW_MATCHING_LOCK_TTL_SECONDS:-10}
      RIDEFLOW_MATCHING_WORKER_INTERVAL_SECONDS: ${RIDEFLOW_MATCHING_WORKER_INTERVAL_SECONDS:-1}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  matching-worker:
    build:
      context: ./backend
      target: development
    environment:
      RIDEFLOW_ENVIRONMENT: ${RIDEFLOW_ENVIRONMENT:-local}
      RIDEFLOW_DATABASE_URL: ${RIDEFLOW_DATABASE_URL:-postgresql+asyncpg://rideflow:rideflow@db:5432/rideflow}
      RIDEFLOW_REDIS_URL: ${RIDEFLOW_REDIS_URL:-redis://redis:6379/0}
      RIDEFLOW_JWT_SECRET: ${RIDEFLOW_JWT_SECRET:-local-development-secret-change-before-production}
      RIDEFLOW_RIDE_OFFER_TTL_SECONDS: ${RIDEFLOW_RIDE_OFFER_TTL_SECONDS:-20}
      RIDEFLOW_MATCHING_STATE_TTL_SECONDS: ${RIDEFLOW_MATCHING_STATE_TTL_SECONDS:-600}
      RIDEFLOW_MATCHING_LOCK_TTL_SECONDS: ${RIDEFLOW_MATCHING_LOCK_TTL_SECONDS:-10}
      RIDEFLOW_MATCHING_WORKER_INTERVAL_SECONDS: ${RIDEFLOW_MATCHING_WORKER_INTERVAL_SECONDS:-1}
    command: python -m app.workers.matching
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
